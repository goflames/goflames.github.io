<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phase 1 · 生产回流飞轮 — 评测平台原型 v2</title>
<style>
:root{
  --sidebar-w:238px; --header-h:52px;
  --c-bg:#F6F7F9; --c-surface:#FFFFFF; --c-surface-hover:#F3F5F7;
  --c-border:rgba(0,0,0,.08); --c-border-strong:rgba(0,0,0,.14);
  --c-text:#1A1C1F; --c-text-2:#5C6068; --c-text-3:#9AA0AA;
  --c-primary:#185FA5; --c-primary-bg:#E8F0FA;
  --c-success:#3B6D11; --c-success-bg:#EDF5E6;
  --c-warning:#BA7517; --c-warning-bg:#FBF2E1;
  --c-danger:#E24B4A; --c-danger-bg:#FCEAEA;
  --c-p0:#E24B4A;--c-p0-bg:#FDE8E8; --c-p1:#BA7517;--c-p1-bg:#FBF2E1; --c-p2:#6B7280;--c-p2-bg:#EEF0F2;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow:0 8px 28px rgba(20,28,40,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;font-size:13px;color:var(--c-text);background:var(--c-bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}

/* ── header ── */
.header{height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;z-index:50}
.logo{font-weight:700;font-size:15px;letter-spacing:-.02em}
.logo b{color:var(--c-primary)}
.crumb{font-size:12px;color:var(--c-text-3);flex:1}
.crumb b{color:var(--c-text-2);font-weight:500}
.search{width:200px;height:32px;padding:0 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);font-size:12px;background:var(--c-bg);outline:none}
.search:focus{border-color:var(--c-primary)}
.btn{height:30px;padding:0 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface);font-size:12px;color:var(--c-text-2);display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn:hover{border-color:var(--c-border-strong);color:var(--c-text)}
.btn.primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.btn.primary:hover{opacity:.92}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

/* ── layout ── */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}

/* ── 项目切换器（置于侧边栏顶部，最左常驻） ── */
.proj{position:relative;display:flex;align-items:center;gap:8px;margin:10px 10px 4px;padding:9px 10px;border:1px solid var(--c-border);border-radius:var(--radius-md);background:var(--c-bg);cursor:pointer;transition:.12s;flex-shrink:0}
.proj:hover{border-color:var(--c-border-strong)}
.proj.open{border-color:var(--c-primary);box-shadow:0 0 0 2px var(--c-primary-bg)}
.proj-info{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.proj-avatar{width:28px;height:28px;border-radius:8px;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.proj-meta{min-width:0;flex:1}
.proj-name{font-size:13px;font-weight:600;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sub{font-size:10.5px;color:var(--c-text-3);margin-top:1px}
.proj-caret{color:var(--c-text-3);font-size:11px;flex-shrink:0;transition:.15s}
.proj.open .proj-caret{transform:rotate(180deg)}
.proj-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--c-surface);border:1px solid var(--c-border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:5px;z-index:100}
.proj.open .proj-menu{display:block}
.proj-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--radius-sm);font-size:13px;color:var(--c-text-2);cursor:pointer}
.proj-item:hover{background:var(--c-surface-hover);color:var(--c-text)}
.proj-item.active{color:var(--c-primary);font-weight:600}
.proj-item:not(.active) .proj-check{display:none}
.proj-check{margin-left:auto;font-size:12px}
.proj-sep{height:1px;background:var(--c-border);margin:5px 4px}
.proj-new{color:var(--c-primary)}
.group-title{padding:16px 18px 6px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--c-text-3);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;margin:1px 8px;border-radius:var(--radius-sm);font-size:13px;color:var(--c-text-2);cursor:pointer;transition:.12s;position:relative}
.nav-item:hover{background:var(--c-surface-hover);color:var(--c-text)}
.nav-item.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--c-primary)}
.badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--c-border);color:var(--c-text-3);font-weight:600}
.badge.p0{background:var(--c-p0-bg);color:var(--c-p0)}
.badge.warn{background:var(--c-warning-bg);color:var(--c-warning)}

/* ── 内嵌树（测试集页专用）── */
/* 评测集浏览：顶部分面导航（替代左侧树） */
.scope-bar{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px}
.scope-groups{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scope-group{padding:6px 14px;border:1px solid var(--c-border);border-radius:20px;font-size:13px;color:var(--c-text-2);cursor:pointer;background:#fff;transition:.15s;white-space:nowrap}
.scope-group:hover{border-color:var(--c-primary);color:var(--c-primary)}
.scope-group.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:500}
.scope-subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--c-border)}
.scope-sub{padding:4px 12px;border-radius:16px;font-size:12px;color:var(--c-text-2);background:var(--c-surface-hover);cursor:pointer;transition:.15s;white-space:nowrap}
.scope-sub:hover{color:var(--c-primary)}
.scope-sub.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:500}
.scope-sub .cnt{margin-left:5px;font-size:11px;opacity:.7}
.ds-crumb{font-size:12px;color:var(--c-text-3);margin-bottom:10px}
.ds-crumb b{color:var(--c-text);font-weight:500}

/* ── 评测集分面下钻（替代左侧深树）── */
.ds-facets{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:14px}
.facet-row{display:flex;align-items:flex-start;gap:10px}
.facet-row + .facet-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--c-border)}
.facet-label{flex:0 0 64px;font-size:12px;color:var(--c-text-3);padding-top:5px;font-weight:500}
.facet-label .req{color:var(--c-danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 12px;border-radius:16px;font-size:12px;color:var(--c-text-2);background:var(--c-surface-hover);cursor:pointer;transition:.15s;white-space:nowrap;border:1px solid transparent}
.chip:hover{color:var(--c-primary);border-color:var(--c-primary)}
.chip.active{background:var(--c-primary);color:#fff;font-weight:500}
.chip.muted{opacity:.45}
.ds-facet-note{font-size:11px;color:var(--c-text-3);margin-top:8px;display:flex;align-items:center;gap:6px}
.ds-facet-note .lv{color:var(--c-danger);font-weight:600}

/* 等级徽章 */
.lv-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.6}
.lv-badge.lv-p0{background:var(--c-danger-bg);color:var(--c-danger)}
.lv-badge.lv-p1{background:#fff4e0;color:#C77700}
.lv-badge.lv-p2{background:#eef2ff;color:#4257d6}
.lv-badge.lv-n{background:var(--c-surface-hover);color:var(--c-text-3)}

.main{flex:1;overflow-y:auto;padding:22px 26px 60px}

/* ── page ── */
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:18px}
.page-title{font-size:19px;font-weight:700;margin-bottom:3px}
.page-desc{font-size:13px;color:var(--c-text-2)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* metrics cards */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.mcard{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:16px 18px}
.mlabel{font-size:12px;color:var(--c-text-2);display:flex;justify-content:space-between;align-items:center}
.mval{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.msub{font-size:12px;margin-top:3px;color:var(--c-text-3)}
.msub.up{color:var(--c-success)} .msub.down{color:var(--c-danger)}

/* grid & card */
.grid{display:flex;gap:16px}.grid-2{grid-template-columns:1fr 1fr;display:grid;gap:16px}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);overflow:hidden}
.card-h{padding:13px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.card-h .t{font-size:14px;font-weight:600}
.card-b{padding:14px 18px}

/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 10px;color:var(--c-text-3);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--c-border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--c-border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--c-surface-hover)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--c-text-2)}
.utt{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.utt:hover{white-space:normal;overflow:visible}

/* pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 13px;border:1px solid var(--c-border);border-radius:20px;font-size:12.5px;color:var(--c-text-2);background:var(--c-surface);cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--c-border-strong)}
.pill.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.pill .cnt{font-size:11px;background:rgba(0,0,0,.07);padding:0 6px;border-radius:8px}
.pill.active .cnt{background:rgba(255,255,255,.25)}

/* tags */
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:600;line-height:18px}
.tag.p0{background:var(--c-p0-bg);color:var(--c-p0)}.tag.p1{background:var(--c-p1-bg);color:var(--c-p1)}.tag.p2{background:var(--c-p2-bg);color:var(--c-p2)}
.tag.ok{background:var(--c-success-bg);color:var(--c-success)}.tag.warn{background:var(--c-warning-bg);color:var(--c-warning)}.tag.err{background:var(--c-danger-bg);color:var(--c-danger)}.tag.gray{background:var(--c-p2-bg);color:var(--c-p2)}
.score{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:5px;font-size:12px;font-weight:700}
.score.s-low{background:var(--c-danger-bg);color:var(--c-danger)}.score.s-mid{background:var(--c-warning-bg);color:var(--c-warning)}.score.s-high{background:var(--c-success-bg);color:var(--c-success)}

/* 仪表盘两栏 + 进度条 + 环形图 */
.dash-row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px;margin-bottom:16px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--c-border)}
.mini-stat{text-align:center}
.mini-stat .v{font-size:16px;font-weight:700}
.mini-stat .l{font-size:11px;color:var(--c-text-3);margin-top:2px}
.bar{height:8px;background:var(--c-surface-hover);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--c-primary);border-radius:6px;transition:width .3s}

/* ── 表头排序指示 ── */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--c-primary)}
.sort{display:inline-flex;align-items:center;gap:2px;margin-left:4px;color:var(--c-text-3);font-size:10px}
th.sortable.asc .sort::after{content:'▲'}
th.sortable.desc .sort::after{content:'▼'}
th.sortable .sort::after{content:'⇅'}

/* ── 抽屉顶栏元数据 ── */
.dmeta{padding:10px 18px;border-bottom:1px solid var(--c-border);display:flex;flex-wrap:wrap;gap:14px 22px;background:var(--c-surface-hover)}
.dmeta-item{display:flex;flex-direction:column;gap:3px;min-width:84px}
.dmeta-item .k{font-size:10.5px;color:var(--c-text-3)}
.dmeta-item .v{font-size:12.5px;font-weight:500;color:var(--c-text);display:flex;align-items:center;gap:4px}
.dmeta-item .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.dmeta-item .v .star{color:var(--c-warning)}

/* ── 抽屉底部分页器 ── */
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--c-border)}
.pager{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-2)}
.pager button{height:24px;min-width:24px;padding:0 7px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface);font-size:11.5px;color:var(--c-text-2)}
.pager button:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pg-info{font-variant-numeric:tabular-nums}
.foot-actions{display:flex;gap:8px}

/* ── 抽屉结构化数据：推荐标签云 + 菜品详情 ── */
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-cloud .ct{font-size:11px;padding:2px 9px;border-radius:12px;background:var(--c-surface);color:var(--c-text-2);border:1px solid var(--c-border)}
.dish-detail{margin-top:10px;padding:12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface-hover)}
.dish-detail .dd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dish-detail .dd-name{font-weight:600;font-size:13px}
.dish-detail .dd-row{display:flex;gap:14px;font-size:12px;color:var(--c-text-2);flex-wrap:wrap}
.dish-detail .dd-row b{color:var(--c-text);font-weight:600}

/* ── 人工复核追踪字段 ── */
.track-field{margin-bottom:12px}
.track-field .tf-label{font-size:12px;font-weight:600;margin-bottom:5px;color:var(--c-text-2)}
.track-field textarea{width:100%;height:60px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px;font-family:inherit;font-size:12.5px;resize:none;background:#fff;box-sizing:border-box}

/* ── 候选入池状态 ── */
.cand-bar{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.cand-stat{display:flex;flex-direction:column;gap:2px}
.cand-stat .n{font-size:20px;font-weight:700}
.cand-stat .l{font-size:11px;color:var(--c-text-3)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.32);opacity:0;pointer-events:none;transition:.2s;z-index:90}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:680px;max-width:92vw;background:var(--c-surface);box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);z-index:100;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{padding:14px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.dh .t{font-size:14px;font-weight:600}
.dtabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--c-border)}
.dtab{padding:10px 12px;font-size:12.5px;color:var(--c-text-2);cursor:pointer;border-bottom:2px solid transparent}
.dtab:hover{color:var(--c-text)}
.dtab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600}
.dbody{flex:1;overflow-y:auto;padding:18px}
.dfoot{padding:12px 18px;border-top:1px solid var(--c-border);display:flex;gap:8px;justify-content:flex-end}
.bubble{max-width:82%;padding:9px 13px;border-radius:12px;margin-bottom:10px;font-size:12.5px;line-height:1.55}
.bubble.u{background:var(--c-primary-bg);color:var(--c-text);margin-left:auto;border-bottom-right-radius:3px}
.bubble.a{background:var(--c-surface-hover);color:var(--c-text);border-bottom-left-radius:3px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--c-border);font-size:12.5px}
.kv .k{color:var(--c-text-3)}
.dim{font-size:12px;color:var(--c-text-3);line-height:1.6}
.empty{padding:40px;text-align:center;color:var(--c-text-3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.35}
.note{font-size:12px;color:var(--c-text-3);margin-top:10px;line-height:1.6}
.flag{display:inline-block;background:var(--c-warning-bg);color:var(--c-warning);font-size:11px;padding:1px 7px;border-radius:5px;margin-left:6px}
.sec-title{font-size:13px;font-weight:600;margin:18px 0 10px;color:var(--c-text)}
.select{border:1px solid var(--c-border);border-radius:var(--radius-sm);height:32px;padding:0 10px;font-size:12.5px;background:var(--c-surface);outline:none;color:var(--c-text)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--c-text-3);margin-top:8px;align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}

/* sub-tabs */
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--c-border);margin-bottom:16px}
.sub-tab{padding:8px 16px;font-size:12.5px;color:var(--c-text-2);cursor:pointer;border-bottom:2px solid transparent}
.sub-tab:hover{color:var(--c-text)}
.sub-tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600}

/* filter row */
.filter-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-row select,.filter-row input{height:32px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:0 10px;font-size:12px;background:var(--c-surface);outline:none}
.filter-row input{width:200px}

/* expand row */
.expand-row{display:none}
.expand-row.show{display:table-row}
.expand-cell{background:var(--c-surface-hover);padding:12px 14px!important}

/* selection counter */
.sel-count{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-2)}
.sel-count b{color:var(--c-primary);font-size:13px}

/* modal */
#modalRoot{display:none;position:fixed;inset:0;z-index:200}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center}
.modal{width:430px;max-width:92vw;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.modal-h{padding:14px 16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--c-border)}
.modal-b{padding:16px}
.fld{margin-bottom:13px;display:flex;flex-direction:column;gap:5px}

.job-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.job-card{border:1px solid var(--c-border);border-radius:var(--radius-md);padding:12px 13px;background:var(--c-surface)}

.jb-body{margin:0;padding:10px 14px;font-size:11.5px;line-height:1.55;color:#e0e0e0;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;overflow:auto;max-height:220px;white-space:pre;user-select:text}

.conv-turns{display:flex;flex-direction:column;gap:0}

.ct-label{font-size:11.5px;color:var(--c-text-3);margin-bottom:2px;font-weight:500}
.ct-query{font-size:13px;color:var(--c-text-1);padding:6px 10px;border-radius:var(--radius-sm);background:var(--c-surface);cursor:default;border:1px solid transparent;transition:all .15s;line-height:1.5}
.ct-query:hover,.ct-query.ct-hl{border-color:var(--c-primary);background:#eff6ff;box-shadow:0 0 0 2px rgba(59,130,246,.12)}
/* 右侧：response */
.ct-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:4px 8px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .15s}
.ct-right:hover,.ct-right.ct-hl{border-color:var(--c-primary);background:#f0f7ff;box-shadow:0 0 0 2px rgba(59,130,246,.08)}
.ct-response{font-size:13px;line-height:1.65;color:var(--c-text-1)}
.ct-extra{font-size:11.5px;color:var(--c-text-3);margin-top:2px;line-height:1.5}

.ct-score{align-self:flex-end;font-size:15px;font-weight:700;color:var(--c-danger);position:relative;top:-2px;right:-2px}

.ct-info{font-size:11px;color:#b45309;background:#fefce8;padding:3px 8px;border-radius:3px;margin-top:2px;border:1px solid #fde68a;line-height:1.5}

.vcs-line{font-size:11px;color:var(--c-text-2);line-height:1.55}

function queueGolden(records, from){
  const list=(Array.isArray(records)?records:[records]).map(r=>({
    id: r.id||r.trace||('gd_'+Math.abs(hashCode((r.text||r.utter||'')+Math.random()))),
    text: r.text||r.utter||'（无语料）',
    tag: r.tag||'—',
    from: from||r.from||'手动加入',
    level: r.level||r.pri||'—',
    score: r.score!=null?r.score:'—',
  }));
  if(list.length===0){ toast('没有可加入的用例'); return; }
  PENDING_GOLDEN={ list, from };
  openGoldenPicker();
}

  if(!sel){ toast('请选择一个集合'); return; }
  const setId=sel.value;
  let added=0, dup=0;
  p.list.forEach(r=>{

  PENDING_GOLDEN=null;

  updateGoldenBadge();

  const desc=inPicker?'':((document.getElementById('gsDesc')||{}).value||'').trim();

  }

/* ═══════════ 辅助渲染函数 ═══════════ */
function passTag(p){const v=parseFloat(p);return `<span class="score ${v>=95?'s-high':v>=85?'s-mid':'s-low'}">${p}</span>`;}
function stTag(s){const c=s==='已完成'?'ok':s==='排队中'?'warn':s==='运行中'?'primary':'gray';return `<span class="tag ${c}">${s}</span>`;}
function jobStatusTag(s){const c=s==='success'?'ok':s==='running'?'primary':s==='fail'?'err':'gray';const t=s==='success'?'成功':s==='running'?'运行中':s==='fail'?'失败':'空闲';return `<span class="tag ${c}">${t}</span>`;}
function pbRows(f){const rows=DATA.prdbad.filter(r=>f==='all'||r.pri===f);
  return rows.map(r=>`<tr onclick="openDrawer('${r.trace}')">
    <td class="mono">${r.trace}</td><td><span class="utt">${r.utter}</span></td>
    <td><span class="tag ${r.pri==='P0'?'p0':r.pri==='P1'?'p1':'p2'}">${r.pri}</span></td>
    <td class="mono">${r.retry}${r.retry>=3?' <span class="tag p0">顽固</span>':''}</td>
    <td><span class="tag ${r.status.includes('待处理')?'err':r.status.includes('入集')?'ok':r.status.includes('人工')?'warn':'gray'}">${r.status}</span></td>
    <td class="dim">${r.source==='eval失败'?'eval低分':r.source}</td><td>${score(r.score)}</td>
    <td style="text-align:right"><span class="btn sm" onclick="event.stopPropagation();queueGolden([{id:'${r.trace}',text:'${r.utter}',tag:'Bad Case',level:'${r.pri}',score:${r.score}}],'Bad Case')"><span style="color:#BA7517">★</span> Golden</span> <span class="btn sm">详情</span></td></tr>`).join('');}

function toggleExpand(tr){const n=tr.nextElementSibling;if(n&&n.classList.contains('expand-row'))n.classList.toggle('show');}

function trendSvg(){const w=520,h=120,pad=10,max=100,min=88;
  const pts=DATA.trend.map((v,i)=>{const x=pad+i*(w-2*pad)/(DATA.trend.length-1);const y=h-pad-((v-min)/(max-min))*(h-2*pad);return[x,y];});
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`${pad},${h-pad} `+line+` ${w-pad},${h-pad}`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--c-primary)"/><text x="${p[0]}" y="${p[1]-8}" font-size="9" fill="var(--c-text-3)" text-anchor="middle">${DATA.trend[i]}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px"><polygon points="${area}" fill="var(--c-primary-bg)"/><polyline points="${line}" fill="none" stroke="var(--c-primary)" stroke-width="2"/>${dots}</svg>`;}

function hitTrendSvg(){const data=DATA.ruleHitTrend,days=DATA.ruleHitDays;const w=360,h=124,pad=12,max=Math.max(...data)*1.18;const pts=data.map((v,i)=>{const x=pad+i*(w-2*pad)/(data.length-1);const y=h-pad-(v/max)*(h-2*pad);return[x,y];});const line=pts.map(p=>p.join(',')).join(' ');const area=`${pad},${h-pad} `+line+` ${w-pad},${h-pad}`;const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--c-primary)"/><text x="${p[0]}" y="${p[1]-7}" font-size="9" fill="var(--c-text-3)" text-anchor="middle">${data[i]}</text>`).join('');const xlab=days.map((d,i)=>`<text x="${pad+i*(w-2*pad)/(data.length-1)}" y="${h-1}" font-size="8" fill="var(--c-text-3)" text-anchor="middle">${d.slice(3)}</text>`).join('');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:130px"><polygon points="${area}" fill="var(--c-primary-bg)"/><polyline points="${line}" fill="none" stroke="var(--c-primary)" stroke-width="2"/>${dots}<text x="${pad}" y="10" font-size="9" fill="var(--c-text-3)">${max.toFixed(0)}</text>${xlab}</svg>`;}
function donutSvg(segs,size=132,centerVal=null,centerSub='Bad Case'){
  const total=segs.reduce((s,x)=>s+x.value,0);
  const cx=size/2, cy=size/2, r=size/2-16, sw=16;
  const cv=centerVal==null?total:centerVal;
  let a0=-Math.PI/2, parts='';
  segs.forEach(s=>{
    const a1=a0+(s.value/total)*Math.PI*2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    parts+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${s.color}" stroke-width="${sw}"/>`;
    a0=a1;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">${parts}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="21" font-weight="700" fill="var(--c-text)">${cv}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="var(--c-text-3)">${centerSub}</text></svg>`;
}

let SORT_STATE={page:null,key:null,dir:null};
const SORT_ARR={
  issues:()=>DATA.issues,
  'exec-results':()=>DATA.execResults,
  prdbad:()=>DATA.prdbad,
  'dataset-browser':()=>DATA.prdBadRaw,
  candidate:()=>DATA.candidates,
  golden:()=>GOLDEN,
};
function sortBy(btn){
  const page=btn.dataset.page, key=btn.dataset.key, arr=SORT_ARR[page];
  if(!arr)return;
  const dir=(SORT_STATE.key===key&&SORT_STATE.dir==='asc')?'desc':'asc';
  SORT_STATE={page,key,dir};
  arr.sort((a,b)=>{
    let x=a[key], y=b[key];
    if(x==null||y==null)return 0;
    if(typeof x==='string') return dir==='asc'?String(x).localeCompare(String(y),'zh'):String(y).localeCompare(String(x),'zh');
    return dir==='asc'? x-y : y-x;
  });
  show(page);
}

function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return h;}
function buildDrawerList(){
  return [
    ...DATA.p0list.map(x=>({...x,trace:x.id,pri:'P0',score:1.8,source:x.from,utter:x.utter})),
    ...DATA.prdbad.map(x=>({...x})),
    ...DATA.candidates.map(x=>({...x,pri:x.level})),
    ...GOLDEN.map(x=>({trace:x.id,utter:x.text,pri:x.level,score:x.score==='—'?2.5:x.score,source:x.from,tag:x.tag,from:x.from})),
  ];
}
function caseMeta(cur){
  const seed=Math.abs(hashCode(cur.trace||''));
  const self=cur.score!=null?cur.score:2.5;
  const st=self>=4?'通过':(self>=2?'有争议':'不通过');
  const stCls=self>=4?'ok':(self>=2?'warn':'err');
  return {
    no:'corpus-'+(seed%89999+10000),
    label:'推荐用例'+cur.pri,
    eid:'BZC'+(seed%900000+100000),
    score:self, st, stCls,
    judge:'莫文凯', time:'2026-07-17 15:31:45'
  };
}
